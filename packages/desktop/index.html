<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StagePilot</title>
    <script>
      // Stamps the theme before first paint so the window never flashes the
      // wrong background. This mirrors parseThemePreference and resolveTheme in
      // src/app/providers/theme.ts: "light" and "dark" are explicit, anything
      // else — "system", nothing stored, junk — follows the OS. ThemeProvider
      // reads the same key back rather than recomputing, so the two agree.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
